name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f app/build.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "Found Android project at repository root."
          elif [ -f BlockVerse/app/build.gradle.kts ]; then
            echo "dir=BlockVerse" >> "$GITHUB_OUTPUT"
            echo "Found Android project in BlockVerse/."
          elif [ -f BlockVerse-v1.4.0-Full-Source.zip ]; then
            unzip -t BlockVerse-v1.4.0-Full-Source.zip
            unzip -q BlockVerse-v1.4.0-Full-Source.zip
            test -f BlockVerse/app/build.gradle.kts
            echo "dir=BlockVerse" >> "$GITHUB_OUTPUT"
            echo "Extracted Android project archive."
          else
            echo "::error::Android project not found. Expected app/build.gradle.kts, BlockVerse/app/build.gradle.kts, or BlockVerse-v1.4.0-Full-Source.zip."
            echo "Repository root contents:"
            ls -la
            exit 1
          fi

      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockVerse-1.4.0-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
